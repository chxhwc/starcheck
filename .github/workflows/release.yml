name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test before publishing
        run: python -m unittest discover -s tests -v

      - name: Build
        run: |
          pip install build
          python -m build

      # Guarded on purpose: a tag must never leave a red X on the repo just
      # because the PyPI token has not been configured yet.
      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::warning title=PyPI skipped::PYPI_API_TOKEN is not set; skipping upload."
            exit 0
          fi
          pip install twine
          python -m twine upload --non-interactive -u __token__ -p "$PYPI_API_TOKEN" dist/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
