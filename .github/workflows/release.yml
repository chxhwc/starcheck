name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Trusted Publishing: no PyPI token anywhere

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test before publishing
        run: python -m unittest discover -s tests -v

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      # continue-on-error: a tag must never leave a red X on the repo just
      # because the Trusted Publisher has not been configured yet. The step
      # is still visible in the log, and the warning below says what to do.
      - name: Publish to PyPI
        id: pypi
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Report PyPI outcome
        if: steps.pypi.outcome == 'failure'
        run: |
          echo "::warning title=PyPI upload skipped::Trusted Publisher is not configured for this repo yet. See https://pypi.org/manage/account/publishing/"
          {
            echo "### PyPI upload skipped"
            echo ""
            echo "The release was created, but the wheel was not published."
            echo "Configure the Trusted Publisher on PyPI (owner \`chxhwc\`, repo \`starcheck\`, workflow \`release.yml\`) and re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
