[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starcheck"
version = "0.4.0"
description = "Audit any repo for star-readiness: 28 checks, one score, copy-paste fixes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "chxhwc" }]
keywords = [
  "github",
  "stars",
  "open-source",
  "cli",
  "readme",
  "audit",
  "launch",
  "growth",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chxhwc/starcheck"
Repository = "https://github.com/chxhwc/starcheck"
Issues = "https://github.com/chxhwc/starcheck/issues"
Changelog = "https://github.com/chxhwc/starcheck/blob/main/CHANGELOG.md"

[project.scripts]
starcheck = "starcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
starcheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"tools/*" = ["E402"]
